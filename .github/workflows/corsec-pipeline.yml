name: CorSec Pipeline

# Runs Hunter → Cort → Patcher → Reporter end-to-end. In dry-run mode every
# artifact is produced and uploaded but no branch is pushed and no PR is
# opened. Flip dry_run: false only after at least a week of clean dry-run
# observation — see README.md "Deployment" section.
#
# Dry run is the default in both senses that matter: the workflow_dispatch
# input defaults to true, AND the Resolve-run-mode step below defaults the
# resolved value to true whenever the input is absent — which is every
# scheduled run, since GitHub does not populate `inputs` for cron events.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true (default), produce artifacts only. Set false to push branch + open PR."
        required: false
        type: boolean
        default: true
      terraform_dir:
        description: "Optional Terraform directory for Cort scans. Empty disables Cort."
        required: false
        type: string
        default: ""

permissions:
  # OIDC token issuance (federated identity with the AWS role)
  id-token: write
  # peter-evans/create-pull-request needs to push the branch + open the PR
  contents: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Mapped to a job-level env so it can be referenced in a step `if:` —
    # the `secrets` context is not available in `if:` expressions, but `env`
    # is. When the secret is unset this is the empty string.
    env:
      AWS_AUDIT_ROLE_ARN: ${{ secrets.AWS_AUDIT_ROLE_ARN }}

    steps:
      # Single source of truth for "is this a dry run".
      #
      # GitHub does NOT populate the `inputs` context for a `schedule` event, so
      # `inputs.dry_run` expands to the empty string on every cron run — the
      # `default: true` above belongs to workflow_dispatch only. Defaulting the
      # shell variable (not just the input) is what makes the unattended path
      # fail CLOSED. Every downstream step reads this step's output rather than
      # re-deriving the answer from `inputs`.
      - name: Resolve run mode
        id: mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          DRY_RUN="${DRY_RUN_INPUT:-true}"
          # Only an explicit "false" is treated as live. Anything else — empty
          # (cron), "true", or an unexpected value — stays dry.
          if [ "$DRY_RUN" != "false" ]; then
            DRY_RUN="true"
          fi
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved dry_run=$DRY_RUN (raw input: '${DRY_RUN_INPUT}', event: ${{ github.event_name }})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python (for Checkov)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Install tfsec
        # Download a PINNED release binary directly instead of the upstream
        # install_linux.sh script. That script first queries the GitHub API for
        # the "latest" release, which is unauthenticated and gets rate-limited
        # on shared runner IPs — the lookup returns empty and the download URL
        # collapses to "File to download not supplied". (tfsec is also archived
        # in favour of Trivy, so the script is no longer maintained.) A direct
        # release-asset download avoids the API entirely.
        env:
          TFSEC_VERSION: v1.28.14
        run: |
          curl -sSL -o tfsec \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: Configure AWS credentials (OIDC)
        # Cort's AWS-context checks are optional. Without the audit role secret
        # there are no credentials to assume, so we skip this step rather than
        # fail the whole run. The orchestrator already degrades gracefully:
        # awsContextChecks only runs when --terraform-dir is set, and any
        # failure inside it is captured (Promise.allSettled) without aborting.
        if: env.AWS_AUDIT_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_AUDIT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install npm dependencies
        run: npm ci

      - name: Run CorSec orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p .corsec
          # --dry-run is recorded in the summary artifact for observability; it
          # does not itself prevent a push (see src/orchestrate.ts). The PR gate
          # below is the control that does.
          DRY_RUN_FLAG=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx src/orchestrate.ts \
            --output-dir .corsec \
            --ecosystem NPM \
            ${{ inputs.terraform_dir != '' && format('--terraform-dir {0}', inputs.terraform_dir) || '' }} \
            $DRY_RUN_FLAG

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corsec-artifacts
          path: |
            .corsec/*.json
            .corsec/pr-description.md
          if-no-files-found: warn

      - name: Determine PR-creation eligibility
        id: pr_gate
        # PR is opened only when: dry_run=false AND patch-session.json has at
        # least one patched-tests-passed result. The orchestrator always
        # writes the file (synthetic on failure), so jq's existence check is
        # safe.
        #
        # The gate is written to fail closed: it opens a PR only on an explicit
        # "false" from the Resolve-run-mode step. Testing `= "true"` instead
        # would let any unexpected value (notably the empty string a cron run
        # used to produce) fall through into an unattended PR.
        run: |
          DRY_RUN="${{ steps.mode.outputs.dry_run }}"
          if [ "$DRY_RUN" != "false" ]; then
            echo "should_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "Skipping PR creation: dry_run=$DRY_RUN."
            exit 0
          fi

          if [ ! -f .corsec/patch-session.json ]; then
            echo "should_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "Skipping PR creation: patch-session.json not found."
            exit 0
          fi

          PASSED_COUNT=$(jq '[.results[] | select(.status == "patched-tests-passed")] | length' \
            .corsec/patch-session.json)
          if [ "$PASSED_COUNT" -gt 0 ]; then
            BRANCH=$(jq -r '.branchName' .corsec/patch-session.json)
            echo "should_open_pr=true" >> "$GITHUB_OUTPUT"
            echo "passed_count=$PASSED_COUNT" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "should_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "Skipping PR creation: zero patched-tests-passed results."
          fi

      - name: Create pull request
        if: steps.pr_gate.outputs.should_open_pr == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.pr_gate.outputs.branch }}
          title: "[CorSec] Security patches: ${{ steps.pr_gate.outputs.passed_count }} packages updated"
          body-path: .corsec/pr-description.md
          labels: |
            security
            automated
          commit-message: |
            chore(security): apply patches from CorSec scan

      - name: Write job summary
        if: always()
        run: |
          echo "## CorSec Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ steps.mode.outputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .corsec/orchestration-summary.json ]; then
            echo "- **Exit code:** $(jq -r '.finalExitCode' .corsec/orchestration-summary.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Match count:** $(jq -r '.matchCount' .corsec/orchestration-summary.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **LLM tokens:** input=$(jq -r '.llmTokens.input' .corsec/orchestration-summary.json), output=$(jq -r '.llmTokens.output' .corsec/orchestration-summary.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Stage durations" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Stage | Status | Duration (ms) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.stages[] | "| \(.name) | \(.status) | \(.durationMs) |"' \
              .corsec/orchestration-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_orchestration-summary.json not produced — orchestrator did not run to completion._" >> "$GITHUB_STEP_SUMMARY"
          fi
