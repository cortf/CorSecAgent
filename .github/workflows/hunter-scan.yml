name: Hunter Scan

on:
  workflow_dispatch:
    inputs:
      since:
        description: "ISO-8601 timestamp to scan from"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Hunter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ inputs.since }}"
          if [ -z "$SINCE" ]; then
            SINCE=$(date -u -d '24 hours ago' --iso-8601=seconds)
          fi
          npx tsx src/hunter/run.ts \
            --since "$SINCE" \
            --ecosystem NPM \
            --output hunter-matches.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: hunter-matches
          path: hunter-matches.json

      - name: Write step summary
        run: |
          COUNT=$(jq length hunter-matches.json)
          echo "## Hunter Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Found **${COUNT}** vulnerable dependencies" >> "$GITHUB_STEP_SUMMARY"
